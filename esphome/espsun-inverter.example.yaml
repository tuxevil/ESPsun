# ESPsun — EXPERIMENTAL, inverter-only.
# NOT COMPILED, NOT VERIFIED ON HARDWARE; DO NOT WIRE BEFORE VBUS REVIEW.
#
# Device class: CH340 USB UART (1A86:7523); Modbus RTU slave ID 0x04.
# The serial settings 19200 8N1 are provisional and MUST be measured.
# Only read-only register sensors are defined.
# The wired PACE/PYLON RS485 BMS will be added in a later stage.
# This file contains no installation-specific secrets.

esphome:
  name: espsun-inverter
  friendly_name: ESPsun Inverter

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  topic_prefix: espsun/inverter

ota:
  - platform: esphome
    password: !secret ota_password

usb_host:

usb_uart:
  - type: ch340
    vid: 0x1A86
    pid: 0x7523
    channels:
      - id: inverter_usb_uart
        baud_rate: 19200 # PROVISIONAL. Confirm with the real serial configuration.
        data_bits: 8
        parity: NONE # PROVISIONAL
        stop_bits: 1
        buffer_size: 1024

modbus:
  - id: inverter_modbus
    uart_id: inverter_usb_uart
    send_wait_time: 500ms

modbus_controller:
  - id: inverter
    modbus_id: inverter_modbus
    address: 0x04
    update_interval: 15s

sensor:
  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "PV Voltage"
    address: 0x3B65
    register_type: holding
    value_type: U_WORD
    device_class: voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Charger Battery Voltage"
    address: 0x3B66
    register_type: holding
    value_type: U_WORD
    device_class: voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "PV Charger Power"
    address: 0x3B68
    register_type: holding
    value_type: U_WORD
    device_class: power
    unit_of_measurement: W
